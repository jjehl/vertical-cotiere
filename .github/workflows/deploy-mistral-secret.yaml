name: Déployer la clé Mistral sur OVH

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-mistral-secret
  cancel-in-progress: false

jobs:
  deploy-secret:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Transmettre la clé et appliquer la configuration du CMS
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
          OVH_HOST: ${{ vars.OVH_HOST }}
          OVH_USER: ${{ vars.OVH_USER }}
          OVH_PORT: ${{ vars.OVH_PORT }}
          OVH_DEPLOY_PATH: ${{ vars.OVH_DEPLOY_PATH }}
        run: python3 scripts/deploy-mistral-secret.py

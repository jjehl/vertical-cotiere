name: Vérifier et construire les images
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TEST_GALLERY_DIRECTORY: ${{ github.workspace }}/.tmp/ci-gallery
      BASE_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier le déploiement des secrets (sans connexion OVH)
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test && npm run typecheck
        working-directory: frontend
      - run: node scripts/init-env.mjs
      - name: Créer les petites images de recette
        run: node scripts/create-ci-gallery.mjs "$TEST_GALLERY_DIRECTORY"
      - run: docker compose -p vertical-ci -f compose.yaml -f deploy/compose.test.yaml -f deploy/compose.assistant-test.yaml config --quiet
      - run: docker compose -p vertical-ci -f compose.yaml -f deploy/compose.test.yaml -f deploy/compose.assistant-test.yaml up --build -d --wait --wait-timeout 600
      - name: Téléversements, remplacements et publication CMS
        run: docker compose -p vertical-ci -f compose.yaml -f deploy/compose.test.yaml -f deploy/compose.assistant-test.yaml exec -T -e RUN_CONTENT_TESTS=true -e SEED_CONTENT=false -e IMPORT_MEDIA=false cms node tests/content.integration.js
      - name: Assistant IA sans clé réelle (permissions, photos et publication)
        run: |
          docker compose -p vertical-ci -f compose.yaml -f deploy/compose.test.yaml -f deploy/compose.assistant-test.yaml exec -T cms node --test tests/assistant.test.js
          docker compose -p vertical-ci -f compose.yaml -f deploy/compose.test.yaml -f deploy/compose.assistant-test.yaml exec -T -e SEED_CONTENT=false -e IMPORT_MEDIA=false cms node tests/assistant.integration.js
      - name: Installer le navigateur de recette
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Parcours du site et connexion au CMS
        run: npx playwright test
        working-directory: frontend
      - name: Logs Compose en cas d’échec
        if: failure()
        run: docker compose -p vertical-ci -f compose.yaml -f deploy/compose.test.yaml -f deploy/compose.assistant-test.yaml logs --tail 100
      - name: Arrêter les services de recette
        if: always()
        run: docker compose -p vertical-ci -f compose.yaml -f deploy/compose.test.yaml -f deploy/compose.assistant-test.yaml down -v
  images:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: web
            dockerfile: frontend/Dockerfile
          - component: cms
            dockerfile: cms/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Préfixe d’image en minuscules
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: production
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

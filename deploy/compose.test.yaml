# À combiner avec compose.yaml sous un nom de projet distinct, sur une base vide.
services:
  seaweedfs:
    ports: !override
      - '127.0.0.1:${TEST_S3_PORT:-8433}:8333'
  cms:
    environment:
      S3_PUBLIC_URL: http://localhost:${TEST_S3_PORT:-8433}/vertical-media
    ports: !override []
    volumes:
      - ${TEST_GALLERY_DIRECTORY:?Créer les images de recette}:/app/legacy-gallery:ro
  web:
    environment:
      NUXT_MEDIA_PUBLIC_BASE_URL: http://localhost:${TEST_S3_PORT:-8433}/vertical-media
    ports: !override
      - '127.0.0.1:${TEST_WEB_PORT:-3100}:3000'
